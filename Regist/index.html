<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Akun - LITERA</title>
    <!-- Pemanggilan File CSS Lokal -->
    <link rel="stylesheet" href="register.css">
    <!-- FontAwesome untuk Ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="../theme.js"></script>
</head>
<body>

    <!-- Lapisan Overlay Blur Estetik -->
    <div class="bg-overlay"></div>

    <div class="auth-container">
        <!-- Kartu Glassmorphism Utama -->
        <div class="glass-card">
            
            <!-- Logo & Heading -->
            <div class="auth-header">
                <div class="logo-icon-wrapper">
                    <img src="../foto/logo.jpeg" alt="Logo Litera" class="logo-img">
                </div>
                <div class="brand-name">LITERA</div>
                <h1>Bergabung dengan Litera</h1>
                <p>Mulai perjalanan hemat kuliah & barter buku bekas Anda</p>
            </div>

            <!-- Form Registrasi -->
            <form class="auth-form" id="form-register">
                
                <div class="input-group">
                    <span class="input-icon"><i class="fa-solid fa-user"></i></span>
                    <input type="text" id="reg-nama" placeholder="Nama Lengkap" required>
                </div>

                <div class="input-group">
                    <span class="input-icon"><i class="fa-solid fa-envelope"></i></span>
                    <input type="email" id="reg-email" placeholder="Email Akademik / Pribadi" required>
                </div>

                <!-- Bagian Password disamakan persis seperti halaman Login -->
                <div class="input-group">
                    <span class="input-icon"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" id="reg-password" placeholder="Kata Sandi" required>
                    <span class="password-toggle" id="togglePassword"><i class="fa-solid fa-eye-slash"></i></span>
                </div>

                <div class="terms-group">
                    <label class="checkbox-label">
                        <input type="checkbox" required>
                        <span>Saya menyetujui syarat & ketentuan serta kebijakan privasi Litera</span>
                    </label>
                </div>

                <button type="submit" class="btn-submit" id="btn-register">
                    <span>Daftar Sekarang</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>

            <div class="divider">
                <span>ATAU</span>
            </div>

            <!-- Social Login Buttons -->
            <div class="social-login">
                <button type="button" class="btn-social">
                    <i class="fa-brands fa-google" style="color: #ea4335;"></i>
                    <span>Google</span>
                </button>
                <button type="button" class="btn-social">
                    <i class="fa-brands fa-apple" style="color: #111111;"></i>
                    <span>Apple</span>
                </button>
            </div>

            <!-- Footer Link -->
            <div class="auth-footer">
                <span>Sudah punya akun? <a href="/login/index.html">Masuk di sini</a></span>
            </div>

        </div>
    </div>

<script>
  const registerForm = document.getElementById('form-register');
  const submitBtn = document.getElementById('btn-register');

  const isLocalLiveServer =
    ['127.0.0.1', 'localhost'].includes(window.location.hostname) &&
    window.location.port !== '3000';

  const API_BASE_URL = isLocalLiveServer ? 'http://127.0.0.1:3000' : '';

  if (registerForm) {
    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const nama = document.getElementById('reg-nama').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-password').value;

      const originalBtnHtml = submitBtn ? submitBtn.innerHTML : '';
      if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span>Memproses...</span>';
      }

      try {
        const response = await fetch(`${API_BASE_URL}/api/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nama, email, password })
        });

        const result = await response.json();

        if (response.ok && result.success) {
          alert('Registrasi Berhasil! Silakan Login.');
          window.location.href = '../login/index.html';
        } else {
          alert(result.message || 'Registrasi gagal.');
        }
      } catch (err) {
        console.error('Register fetch error:', err);
        alert(
          isLocalLiveServer
            ? 'Gagal terhubung ke server backend! Jalankan dulu: node server.js'
            : 'Gagal terhubung ke server backend! Periksa koneksi atau konfigurasi API Vercel.'
        );
      } finally {
        if (submitBtn) {
          submitBtn.disabled = false;
          submitBtn.innerHTML = originalBtnHtml;
        }
      }
    });
  }

  // Logika toggle ikon mata disamakan persis seperti pada login
  const passwordInput = document.getElementById('reg-password');
  const togglePasswordBtn = document.getElementById('togglePassword');

  if (togglePasswordBtn && passwordInput) {
    togglePasswordBtn.addEventListener('click', function () {
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);

      const icon = this.querySelector('i');
      if (icon) {
        icon.classList.toggle('fa-eye');
        icon.classList.toggle('fa-eye-slash');
      }
    });
  }
</script>
<!-- INTEGRASI LOGIN GOOGLE & APPLE VIA SUPABASE OAUTH -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {
    // Sesuaikan dengan URL & Anon Key Supabase proyek litera_db milikmu
    const SUPABASE_URL = window.SUPABASE_URL || 'https://ygtbxmhslohgofwwksjt.supabase.co';
    const SUPABASE_ANON_KEY = window.SUPABASE_ANON_KEY || 'sb_publishable_ayyZ90SPYFKdWuuliWMr9g_GxUOxA9t';

    // Gunakan client Supabase yang sudah ada atau buat baru
    const sbClient = window.supabaseClient || (
        SUPABASE_URL.includes('supabase.co') && !SUPABASE_URL.includes('YOUR_PROJECT_REF')
            ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
            : null
    );

    // 1. Tangani Callback Setelah User Kembali dari Halaman Login Google / Apple
    async function handleOAuthSession() {
        if (!sbClient) return;
        const { data: { session }, error } = await sbClient.auth.getSession();
        if (error || !session || !session.user) return;

        const authUser = session.user;
        const email = authUser.email;
        const fullName = authUser.user_metadata?.full_name
            || authUser.user_metadata?.name
            || email.split('@')[0];
        const avatarUrl = authUser.user_metadata?.avatar_url || '';

        // Cek atau simpan user ke tabel 'users' agar sinkron dengan sistem LITERA
        let { data: dbUser } = await sbClient
            .from('users')
            .select('*')
            .eq('email', email)
            .maybeSingle();

        if (!dbUser) {
            const { data: insertedUser } = await sbClient
                .from('users')
                .insert([{
                    username: fullName,
                    email: email,
                    role: 'user',
                    avatar: avatarUrl
                }])
                .select()
                .single();
            dbUser = insertedUser || { username: fullName, email, role: 'user', avatar: avatarUrl };
        }

        // Simpan sesi login ke localStorage agar Header, Katalog & Dashboard mengenali user
        localStorage.setItem('litera_user', JSON.stringify(dbUser));
        localStorage.setItem('user', JSON.stringify(dbUser));

        // Arahkan sesuai role
        if (dbUser.role === 'admin') {
            window.location.href = '../Dashboard Admin/dashboardadmin.html';
        } else {
            window.location.href = '../Katalog/index.html';
        }
    }

    // 2. Fungsi Trigger Login OAuth ('google' atau 'apple')
    window.loginWithOAuth = async function (provider) {
        if (!sbClient) {
            alert('Konfigurasi SUPABASE_URL dan SUPABASE_ANON_KEY belum diisi pada skrip OAuth.');
            return;
        }

        const redirectTo = window.location.origin + window.location.pathname;
        const { error } = await sbClient.auth.signInWithOAuth({
            provider: provider,
            options: {
                redirectTo: redirectTo,
                queryParams: provider === 'google' ? { prompt: 'select_account' } : undefined
            }
        });

        if (error) {
            console.error(`Gagal login dengan ${provider}:`, error.message);
            alert(`Gagal masuk dengan ${provider.toUpperCase()}: ${error.message}`);
        }
    };

    // 3. Pasang Event Klik Otomatis ke Tombol Google & Apple di Halaman
    document.addEventListener('DOMContentLoaded', () => {
        handleOAuthSession();

        document.querySelectorAll('button, a').forEach(btn => {
            const label = btn.textContent.trim().toLowerCase();
            if (label === 'google' || btn.classList.contains('btn-google')) {
                btn.type = 'button';
                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    window.loginWithOAuth('google');
                });
            } else if (label === 'apple' || btn.classList.contains('btn-apple')) {
                btn.type = 'button';
                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    window.loginWithOAuth('apple');
                });
            }
        });
    });
})();
</script>
</body>
